<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moorasa Web</title>
    <link rel="stylesheet" href="../css/welcome.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
</head>
<body>

<div class="phone-canvas">
    
    <div id="splash-screen">
        <img src="../img/logo.png" class="illustration" alt="logo">
        <h1 class="logo-text">MooRasa</h1>
    </div>

    <div id="welcome-screen">
        <img src="../img/logo.png" class="illustration" >
        <h1 class="logo-text" style="font-size: 2rem; margin-bottom: 50px;">MooRasa</h1>

        <div class="btn-card">
            <button class="btn-custom btn-login"><a href="login.html">
                Log in
            </a>
            </button>
        
            <button class="btn-custom btn-signup"> <a href="signup.html">
                 Sign up
            </a>
               
            </button>
        </div>

        
    </div>

</div>

<script>
    // Logika Transisi Sederhana
    window.onload = () => {
        const splash = document.getElementById('splash-screen');
        const welcome = document.getElementById('welcome-screen');

        // Tampilkan Splash selama 2 detik, lalu pindah ke Welcome Screen
        setTimeout(() => {
            splash.classList.add('hidden');
            welcome.classList.add('visible');
        }, 2000);
    };
</script>

</body>
</html>
