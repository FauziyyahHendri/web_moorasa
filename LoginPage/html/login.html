<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moorasa - Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../css/welcome.css">

    <style>
        /* Variabel Warna Sesuai Desain 
        :root {
            --primary-blue: #6d9bb8;
            --primary-blue-hover: #5a8aa8;
            --text-dark: #333333;
            --text-muted: #888888;
            --bg-light: #ffffff;
            --border-color: #ced4da;
            --logo-grad-1: #e06c52;
            --logo-grad-2: #e9bc4d;
            --logo-grad-3: #5ba3d4;
        }

        body {
            font-family: sans-serif;
            background-color: #f9f9f9;
            color: var(--text-dark);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }

        /* Container Handphone (Mockup) 
        .app-container {
            width: 100%;
            max-width: 400px;
            background: #ffffff;
            padding: 40px 30px;
            border-radius: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            text-align: center;
        }

        /* Styling Logo Moorasa 
        .logo-text {
            font-weight: 800;
            font-size: 2rem;
            letter-spacing: 2px;
            text-align: center;
            margin-bottom: 20px;
            background: linear-gradient(to right, var(--logo-grad-1), var(--logo-grad-2), var(--logo-grad-3));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .illustration {
            width: 150px;
            display: block;
            margin: 0 auto 30px auto;
        }

        /* Form Styling 
        .form-label-custom {
            font-weight: 600;
            font-size: 0.9rem;
            margin-bottom: 15px;
            display: block;
            text-align: center;
        }

        .form-control {
            border-radius: 10px;
            padding: 12px 15px;
            border: 1px solid var(--border-color);
            margin-bottom: 15px;
            font-size: 0.9rem;
        }

        .password-wrapper {
            position: relative;
        }

        .password-wrapper i {
            position: absolute;
            right: 15px;
            top: 13px;
            color: var(--text-muted);
            cursor: pointer;
        }

        /* Button Styling 
        .btn-primary-custom {
            background-color: var(--primary-blue);
            border: none;
            border-radius: 25px;
            padding: 12px;
            font-weight: 600;
            width: 100%;
            color: white;
            transition: 0.3s;
        }

        .btn-primary-custom:hover {
            background-color: var(--primary-blue-hover);
        }

        .btn-outline-custom {
            background-color: transparent;
            border: 1px solid var(--primary-blue);
            border-radius: 25px;
            padding: 12px;
            font-weight: 600;
            width: 100%;
            color: var(--primary-blue);
            margin-top: 10px;
        }

        .footer-link {
            text-align: center;
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .footer-link a {
            color: #6c63ff;
            text-decoration: none;
            font-weight: 600;
        }
        */
    </style>
</head>
<body>

<div class="phone-canvas">
    <h1 class="logo-text">MooRasa</h1>

    <div class="text-center">
        <img src="../img/logo.png" alt="illustration" class="illustration">
    </div>

    <span class="form-label-custom">Masuk Ke Akun Anda</span>

    <form>
        <input type="email" class="form-control" placeholder="Email" required>
        
        <div class="password-wrapper">
            <input type="password" class="form-control" placeholder="Password" required>

        </div>



        <button type="submit" class="btn-card btn-custom btn-login">Login</button>
    </form>



    <div class="footer-link">
        Tidak memiliki akun? <a href="signup.html">Sign up</a>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
