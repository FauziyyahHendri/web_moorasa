<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moorasa - Sign Up</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">

    <style>
        /* CSS VARIABLES - Agar warna konsisten & mudah diubah */
        :root {
            --primary-blue: #6d9bb8;
            --primary-blue-hover: #5a8aa8;
            --logo-grad: linear-gradient(to right, #e06c52, #e9bc4d, #5ba3d4);
            --text-dark: #333333;
            --text-muted: #999999;
        }

        body {
            font-family: sans-serif;
            background-color: #f8f9fa;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }

        /* Container Handphone */
        .app-container {
            width: 100%;
            max-width: 400px;
            background: #ffffff;
            padding: 40px 30px;
            border-radius: 35px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            text-align: center;
        }

        /* Logo & Ilustrasi*/
        .illustration-box {
            padding: 0px;
        }

        .illustration-img {
            width: 150px;
            height: 120px;
        }

        .logo-text {
            font-weight: 800;
            font-size: 2.2rem;
            letter-spacing: 1.5px;
            background: var(--logo-grad);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 25px;
            display: inline-block;
        }

        .form-title {
            font-weight: 600;
            font-size: 0.95rem;
            color: var(--text-dark);
            margin-bottom: 25px;
        }

        /* Form Input Styling */
        .input-wrapper {
            position: relative;
            margin-bottom: 15px;
        }

        .form-control {
            border-radius: 12px;
            padding: 12px 15px;
            border: 1px solid #e0e0e0;
            font-size: 0.9rem;
        }

        .form-control:focus {
            border-color: var(--primary-blue);
            box-shadow: 0 0 0 3px rgba(109, 155, 184, 0.1);
        }

        .password-toggle {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            cursor: pointer;
        }

        /* Tombol Sign Up */
        .btn-signup {
            background-color: var(--primary-blue);
            color: white;
            border: none;
            border-radius: 25px;
            padding: 13px;
            width: 100%;
            font-weight: 600;
            margin-top: 25px;
            transition: 0.3s;
        }

        .btn-signup:hover {
            background-color: var(--primary-blue-hover);
        }

        .footer-text {
            padding: 20px;
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .footer-text a {
            color: var(--primary-blue);
            text-decoration: none;
            font-weight: 700;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <div class="illustration-box">
            <img src="../img/logo.png" class="illustration-img" alt="Moorasa Icon">
        </div>
        <h1 class="logo-text">MooRasa</h1>

        <p class="form-title">Buat Akun Anda</p>

        <form action="#">
            <div class="input-wrapper">
                <input type="email" class="form-control" placeholder="Email" required>
            </div>

            <div class="input-wrapper">
                <input type="password" class="form-control" placeholder="Password" required>
            </div>

            <div class="input-wrapper">
                <input type="password" class="form-control" placeholder="Confirm Password" required>
            </div>

            <button type="submit" class="btn-signup">Sign up</button>
        </form>


        <p class="footer-text">
            Already have an account? <a href="login.html">Login</a>
        </p>
    </div>

</body>
</html>
